services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: crismin-postgres
    environment:
      POSTGRES_USER: crismin
      POSTGRES_PASSWORD: crismin
      POSTGRES_DB: crismin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crismin -d crismin"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: crismin-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: crismin-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://crismin:crismin@postgres:5432/crismin
      REDIS_URL: redis://redis:6379/0
      NEMOTRON_API_KEY: ${NEMOTRON_API_KEY}
      NEMOTRON_BASE_URL: https://integrate.api.nvidia.com/v1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    container_name: crismin-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
